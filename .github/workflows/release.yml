name: Release

# Testler master'a her push'ta ve PR'da koşar; exe yalnızca `v*` etiketi
# push edildiğinde (ya da elle tetiklemede) derlenir. Böylece etiket
# derlemesi Rust bagimlilik agacini bir kez release profiliyle derler.
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  # Actions, Node.js 20'yi desteklemeyi birakip Node 24'e zorluyor; eski
  # major'da kalmak yerine dogrudan 24'e gecip uyariyi da kaldiriyoruz.
  NODE_VERSION: '24'

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          # Runner'da NODE_ENV=production ayarlıysa `npm ci` devDependencies'i
          # atlar ve Vite/Tailwind kurulu olmaz.
          NODE_ENV: development

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # Supabase değerleri burada gerekmez: `npm run build` eksik
      # VITE_* değerleriyle de geçer, `isSupabaseConfigured` false döner ve
      # istemci null kalır. Gerçek değerler yalnızca exe'ye gömülürken lazım.
      - name: Type-check and build frontend
        run: npm run build

  build:
    name: Build Windows portable exe
    runs-on: windows-latest

    # master'a push ve PR'lerde yalnızca test koşar; exe derlemesi yalnızca
    # `v*` etiketiyle (veya elle tetiklemede) yapılır. Koşulsuz çalıştırılsaydı
    # her push'ta gereksiz yere tam derleme yapılırdı.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Write .env from secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Build'in çalışması için değerler gerekli. Eksikse sessizce
          # "yapılandırma eksik" ekranı üreten bir exe yayınlamaktansa
          # işi durdur.
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            Write-Error "Supabase secret'ları tanımlı değil: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY"
            exit 1
          }
          "VITE_SUPABASE_URL=$env:SUPABASE_URL" | Out-File -FilePath ".env" -Encoding utf8
          "VITE_SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" | Out-File -FilePath ".env" -Encoding utf8 -Append

      # Tauri, `npm run tauri build` içinde `beforeBuildCommand` olarak
      # `npm run build`'i zaten çalıştırır; bu yüzden tekrarlanmıyor.
      - name: Build portable exe
        # --no-bundle: NSIS/MSI uretmez, yalnizca exe'yi birakir.
        # --ci: deger soran istemleri kapatir, action log'ta takilir.
        run: npm run tauri build -- --no-bundle --ci

      - name: Collect artifacts
        shell: pwsh
        run: |
          # Yalnızca taşınabilir exe. NSIS kurulum sihirbazı üretilmiyor:
          # kullanıcı indirip çift tıklar, kurulum adımı yok.
          # Bu blok yine de NSIS'e düşerse işi durdur — kullanıcı yanlış
          # dosyayı indirip "kurulum gerekiyor" sanmasın.
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue
          if ($nsis) {
            Write-Error "NSIS kurulum dosyasi uretildi, bu istenmiyor: $($nsis.Name)"
            exit 1
          }

          $exe = "src-tauri\target\release\veli-scanner.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Derlenen exe bulunamadi: $exe"
            exit 1
          }

          $outdir = "artifacts"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null
          Copy-Item $exe -Destination $outdir

          # Kullaniciya gosterilecek ad: urun adi + surum, bosluksuz.
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Rename-Item "$outdir\veli-scanner.exe" "Veli-Logistics-Tracker-$version.exe"

          Get-ChildItem $outdir | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Etiket adıyla adlandırılır: run içinde birden fazla artifact
          # biriktirilirse (elle tetikleme, yeniden deneme) aynı isim çakışır
          # ve action hata verir.
          name: veli-scanner-windows-${{ github.ref_name }}
          path: artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true