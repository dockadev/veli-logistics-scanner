name: Release

# Etiket (v1.0.0 gibi) push edildiğinde tetiklenir.
# Elle tetiklemek için: Actions > Release > Run workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          # Runner'da NODE_ENV=production ayarlıysa `npm ci` devDependencies'i
          # atlar ve Vite/Tailwind kurulu olmaz.
          NODE_ENV: development

      - name: Write .env from secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Build'in çalışması için değerler gerekli. Eksikse sessizce
          # "yapılandırma eksik" ekranı üreten bir exe yayınlamaktansa
          # işi durdur.
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            Write-Error "Supabase secret'ları tanımlı değil: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY"
            exit 1
          }
          "VITE_SUPABASE_URL=$env:SUPABASE_URL" | Out-File -FilePath ".env" -Encoding utf8
          "VITE_SUPABASE_ANON_KEY=$env:SUPABASE_ANON_KEY" | Out-File -FilePath ".env" -Encoding utf8 -Append

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Type-check and build frontend
        run: npm run build

      # Tauri, `npm run tauri build` içinde `beforeBuildCommand` olarak
      # `npm run build`'i zaten çalıştırır; bu yüzden tekrarlanmıyor.
      - name: Build Tauri bundle
        run: npm run tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $outdir = "artifacts"
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null

          # NSIS kurulum dosyası
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" |
            ForEach-Object { Copy-Item $_.FullName -Destination $outdir }

          # Taşınabilir exe
          Copy-Item "src-tauri\target\release\veli-scanner.exe" -Destination $outdir

          Get-ChildItem $outdir | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veli-scanner-windows
          path: artifacts/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true