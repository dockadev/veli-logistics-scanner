[package]
name = "veli-scanner"
version = "1.0.0"
description = "Foxhole save dosyalarını okuyup veritabanına aktarır"
edition = "2024"
rust-version = "1.85"

[lib]
name = "veli_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
# Tam LTO yerine `thin`: ince LTO çok çekirdekli derlemeyi bozmaz, exe'yi
# belirgin büyütmeye de zorlamaz. `codegen-units` bilinçli olarak varsayılan
# bırakıldı — 1 yapmak runner'ın işlemcilerini boşa çıkarıyordu.
lto = "thin"
strip = true
panic = "abort"
