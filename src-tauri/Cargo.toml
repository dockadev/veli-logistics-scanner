[package]
name = "veli-scanner"
version = "1.0.0"
description = "Foxhole save dosyalarını okuyup veritabanına aktarır"
edition = "2024"
rust-version = "1.85"

[lib]
name = "veli_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
